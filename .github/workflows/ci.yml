name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate skill metadata
        run: node scripts/validate-skills.js

      - name: Build index
        run: node scripts/build-index.js

      - name: Verify generated index is committed
        run: git diff --exit-code skills-index.json

      - name: Test CLI
        run: npm test

      - name: Verify packaged writer handoff
        run: python3 skills/ads/capabilities/write-video-ad-script/scripts/verify_handoff.py

      - name: Test street-interview prompt preflight
        run: |
          python3 skills/ads/capabilities/render-street-interview/scripts/selftest.py
          python3 -m unittest discover -s skills/ads/capabilities/render-street-interview/tests -p 'test_prompt_budget.py' -v

  media-tests:
    # The media helpers are pinned to macOS system fonts (render-imessage-cascade), so these
    # run on macOS. Local ffmpeg fixtures only; no provider calls.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg and test deps
        run: |
          brew install ffmpeg
          python -m pip install pytest pillow numpy requests

      - name: Test video media helpers
        run: >
          python -m pytest -q
          test/recipe-media-fixes
          skills/ads/capabilities/review-finished-ad/tests
          skills/ads/capabilities/create-vo-elevenlabs/tests
          skills/ads/capabilities/create-creator-takes-h3/tests
          skills/ads/capabilities/media-proxy/tests
          skills/ads/packs/ugc-video-formats/create-video-seedance-2-fal/tests
