name: CI

on:
  # Every pull request is checked, whatever its base: dev, main, the
  # video-merged integration branch and video/** lane branches included.
  pull_request:
  # Pushes run the same checks. Only dev and main deploy or publish (see the
  # jobs' if: lines); video-merged is checked after each merge.
  push:
    branches: [dev, main, video-merged]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test catalog deployment
        run: node --test scripts/__tests__/deploy-catalog.test.mjs

      - name: Validate skill metadata
        run: node scripts/validate-skills.js

      - name: Build index
        run: node scripts/build-index.js

      - name: Verify generated index is committed
        run: git diff --exit-code skills-index.json

      - name: Test CLI
        run: npm test

      - name: Verify packaged writer handoff
        run: python3 skills/ads/capabilities/write-video-ad-script/scripts/verify_handoff.py

      - name: Test review-ugc-render speech gate
        # Pure stdlib Python: no ffmpeg, pytest or network (transcription is stubbed).
        run: python3 skills/ads/packs/ugc-video-formats/review-ugc-render/tests/test_review_render.py

      - name: Test street-interview prompt preflight
        run: |
          python3 skills/ads/capabilities/render-street-interview/scripts/selftest.py
          python3 -m unittest discover -s skills/ads/capabilities/render-street-interview/tests -p 'test_prompt_budget.py' -v

  atom-checks:
    # What video atoms may say, their version bumps, and the parts index.
    # Old debt warns; debt a branch adds fails (scripts/atom-lint.js).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pick the base to compare with
        # A pull request compares with its base branch, which must resolve. A push
        # compares with the commit before it; a new branch or a force push whose
        # old tip is gone has no base, and then old debt only warns.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "BASE=$BEFORE" >> "$GITHUB_ENV"
          else
            echo "BASE=" >> "$GITHUB_ENV"
          fi

      - name: Test the atom and part checks
        run: node --test scripts/__tests__/atom-lint.test.js scripts/__tests__/check-atom-versions.test.js scripts/__tests__/check-parts.test.js

      - name: Atom lint
        run: node scripts/atom-lint.js --base "$BASE"

      - name: Atom version bumps
        run: node scripts/check-atom-versions.js --base "$BASE"

      - name: Parts index and frozen versions
        run: node scripts/check-parts.js --base "$BASE"

  imessage-chat-browser-tests:
    # Headless-Chromium tests for render-imessage-chat, including the QA-60
    # platform safe-area layout. Installs only Playwright's Chromium (no other
    # browsers); local fixtures, no media downloads or provider calls.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/ads/capabilities/render-imessage-chat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        run: |
          npm ci --prefix scripts
          cd scripts && npx playwright install --with-deps chromium

      - name: Test chat renderer and safe-area layout
        run: node --test --test-concurrency=1 tests/test_safe_area.js tests/test_chat.js

  media-tests:
    # The media helpers are pinned to macOS system fonts (render-imessage-cascade), so these
    # run on macOS. Local ffmpeg fixtures only; no provider calls.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg and test deps
        run: |
          brew install ffmpeg
          python -m pip install pytest pillow numpy requests

      - name: Test video media helpers
        run: >
          python -m pytest -q
          test/recipe-media-fixes
          skills/ads/capabilities/review-finished-ad/tests
          skills/ads/capabilities/create-vo-elevenlabs/tests
          skills/ads/capabilities/create-creator-takes-h3/tests
          skills/ads/capabilities/media-proxy/tests
          skills/ads/packs/ugc-video-formats/create-video-seedance-2-fal/tests
          skills/ads/capabilities/render-street-interview/tests/test_single_gen_rejection.py
          skills/ads/packs/video-ad-formats/stitch-videos-ffmpeg/tests
          skills/ads/capabilities/compose-creator-layer/tests

  deploy-catalog:
    # Ships only after every check passes, and only from dev or main.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    needs: [validate, atom-checks, imessage-chat-browser-tests, media-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: ${{ github.ref_name == 'dev' && 'staging' || 'production' }}
    concurrency:
      group: skills-catalog-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publish agent catalog and wait for completion
        env:
          TRIGGER_SECRET_KEY: ${{ secrets.TRIGGER_SECRET_KEY }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: node scripts/deploy-catalog.mjs

  dispatch-public-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-catalog
    runs-on: ubuntu-latest
    steps:
      - name: Update production CMS and docs
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GOOSEWORKS_APP_REPO_TOKEN }}
          repository: ${{ secrets.GOOSEWORKS_APP_REPO }}
          event-type: goose_skills_updated
          client-payload: '{"source":"goose-skills","ref":"${{ github.ref }}","sha":"${{ github.sha }}"}'

  npm-release:
    # The npm package publishes from main only, after every check passes.
    # The npm-release environment holds NPM_TOKEN and is limited to main in
    # the repository settings. On other changes it opens or updates the
    # release pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, atom-checks, imessage-chat-browser-tests, media-tests]
    runs-on: ubuntu-latest
    environment: npm-release
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          publish: npm publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
