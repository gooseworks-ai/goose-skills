<!doctype html>
<html><head><meta charset="utf-8">
<link id="fonts" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  :root { --bg: #f4dc8a; --bg2: #eccd6f; --paper: #fffdf8; --ink: #0f5a5c; --accent: #e85d42;
          --label: #3a3a3a; --head-font: 'Permanent Marker', cursive; --label-font: 'Space Mono', monospace; }
  .bg { position: absolute; inset: 0; background:
        radial-gradient(ellipse at 50% 40%, var(--bg) 0%, var(--bg) 55%, var(--bg2) 100%); }
  .card { position: absolute; left: 90px; top: 170px; width: 900px; height: 1560px;
          background: var(--paper); border-radius: 10px;
          box-shadow: 0 30px 60px rgba(0,0,0,.20), 0 4px 10px rgba(0,0,0,.10);
          transform-origin: 50% 60%; }
  .head { position: absolute; left: 60px; right: 60px; top: 70px; text-align: center;
          font-family: var(--head-font); color: var(--ink); line-height: .98;
          transform: rotate(-3deg); }
  .head .l1 { font-size: 88px; white-space: nowrap; }
  .head .l2 { font-size: 118px; white-space: nowrap; }
  .u { position: relative; display: inline-block; }
  .u svg { position: absolute; left: -6%; width: 112%; bottom: -18px; height: 30px; overflow: visible; }
  .u path { stroke: var(--accent); stroke-width: 9; fill: none; stroke-linecap: round; }
  .prods { position: absolute; left: 50px; right: 50px; top: 420px; height: 330px;
           display: flex; align-items: flex-end; justify-content: center; gap: 14px; }
  .prods img { max-width: 170px; object-fit: contain; filter: drop-shadow(0 18px 14px rgba(0,0,0,.18)); }
  .prods img.wide { max-width: 205px; }
  .rows { position: absolute; left: 70px; right: 70px; top: 810px; }
  .rows.noprods { top: 470px; }
  .row { position: relative; height: 118px; display: flex; align-items: flex-end; padding-bottom: 14px; }
  .row::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
                background: var(--ink); opacity: .85; border-radius: 2px; transform: rotate(-.6deg); }
  .lbl { font-family: var(--label-font); font-weight: 700; font-size: 30px; color: var(--label);
         letter-spacing: 2px; width: 330px; }
  .val { font-family: var(--head-font); font-size: 56px; color: var(--ink); flex: 1; transform: rotate(-2deg); }
  .chk { width: 64px; height: 64px; margin-bottom: 6px; }
  .chk path { stroke: var(--accent); stroke-width: 9; fill: none; stroke-linecap: round;
              stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
  .foot { position: absolute; left: 0; right: 0; top: 1330px; display: flex; flex-direction: column;
          align-items: center; gap: 22px; }
  .foot img { max-width: 300px; max-height: 110px; object-fit: contain; }
  .wordmark { font-family: var(--head-font); font-size: 64px; color: var(--ink); }
  .cta { font-family: var(--label-font); font-weight: 700; font-size: 30px; color: var(--paper);
         background: var(--ink); padding: 14px 30px; border-radius: 999px; letter-spacing: 1px; }
  .fine { font-family: var(--label-font); font-size: 18px; color: var(--label); opacity: .75;
          text-align: center; padding: 0 40px; }
</style></head>
<body>
<div class="bg"></div>
<div class="card" id="card">
  <div class="head"><div class="l1" id="l1"></div><div class="l2" id="l2"></div></div>
  <div class="prods" id="prods"></div>
  <div class="rows" id="rows"></div>
  <div class="foot" id="foot"><div class="cta" id="cta"></div></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
window.setup = (c) => {
  const root = document.documentElement.style;
  const t = c.theme || {};
  for (const [k, v] of Object.entries({ bg: t.bg, bg2: t.bg2 || t.bg, paper: t.paper, ink: t.ink,
                                         accent: t.accent, label: t.label })) {
    if (v) root.setProperty('--' + k, v);
  }
  const fonts = c.fonts || {};
  if (fonts.heading) root.setProperty('--head-font', `'${fonts.heading}', cursive`);
  if (fonts.label) root.setProperty('--label-font', `'${fonts.label}', monospace`);
  // No weight axis: single-weight display fonts 400 if a weight is requested that they lack.
  const gfam = [fonts.heading || 'Permanent Marker', fonts.label || 'Space Mono']
    .map(f => 'family=' + encodeURIComponent(f).replace(/%20/g, '+')).join('&');
  document.getElementById('fonts').href = `https://fonts.googleapis.com/css2?${gfam}&display=block`;

  const under = (s, word) => {
    const e = esc(s), w = esc(word);
    return e.includes(w)
      ? e.replace(w, `<span class="u">${w}<svg viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M2 7 Q 30 2 55 5 T 98 4"/></svg></span>`)
      : e;
  };
  document.getElementById('l1').innerHTML = esc(c.head1);
  document.getElementById('l2').innerHTML = under(c.head2, c.underline || c.head2);
  const prods = c.products || [];
  document.getElementById('prods').innerHTML = prods.map(p =>
    `<img src="${p.src}" class="${p.wide ? 'wide' : ''}" style="height:${p.h || 100}%">`).join('');
  const rows = document.getElementById('rows');
  if (!prods.length) rows.classList.add('noprods');
  rows.innerHTML = (c.rows || []).map(r =>
    `<div class="row"><div class="lbl">${esc(r.label)}</div><div class="val">${esc(r.value)}</div>
     <svg class="chk" viewBox="0 0 40 40"><path pathLength="100" d="M6 22 L16 32 L35 8"/></svg></div>`).join('');
  const foot = document.getElementById('foot');
  foot.insertAdjacentHTML('afterbegin', c.logo
    ? `<img id="logo" src="${c.logo}">`
    : `<div class="wordmark">${esc(c.wordmark || '')}</div>`);
  document.getElementById('cta').textContent = c.cta || '';
  if (c.fine_print) foot.insertAdjacentHTML('beforeend', `<div class="fine">${esc(c.fine_print)}</div>`);
};
// t in seconds: the card slides and tilts in, then each row's check draws in turn.
window.setT = (t) => {
  const e = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
  const k = e(t / 0.45);
  document.getElementById('card').style.transform =
    `translateY(${(1 - k) * 1400}px) rotate(${-1.5 + (1 - k) * 8}deg)`;
  document.querySelectorAll('.chk path').forEach((p, i) => {
    const s = 0.7 + i * 0.35;
    p.style.strokeDashoffset = 100 * (1 - e((t - s) / 0.25));
  });
};
</script>
</body></html>
